<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QaraamiGenAI mark — variations</title>
    <style>
      body {
        margin: 0;
        font-family: Nunito, system-ui, sans-serif;
      }
      .sheet {
        padding: 32px 24px;
      }
      .dark {
        background: #0c0b14;
        color: #ede9dc;
      }
      .light {
        background: #e4e1da;
        color: #1a1822;
      }
      .light svg {
        --accent: #876128;
      }
      .dark svg {
        --accent: #c89b5f;
      }
      h1 {
        font:
          500 22px/1.2 'Playfair Display',
          Georgia,
          serif;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 20px;
        opacity: 0.7;
        font-size: 14px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }
      .card {
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 6px;
        padding: 20px;
      }
      .card h2 {
        font:
          500 16px/1.2 'Playfair Display',
          Georgia,
          serif;
        margin: 0 0 14px;
      }
      .sizes {
        display: flex;
        align-items: flex-end;
        gap: 18px;
        flex-wrap: wrap;
      }
      .lockup {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        font:
          500 20px 'Playfair Display',
          Georgia,
          serif;
      }
      .lockup b {
        font-weight: 500;
        color: var(--amber);
      }
      .dark .lockup b {
        color: #c89b5f;
      }
      .light .lockup b {
        color: #876128;
      }
      .fav {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        background: #0c0b14;
        padding: 4px;
        box-sizing: border-box;
      }
      svg {
        display: block;
        stroke: currentColor;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .acc {
        stroke: var(--accent);
      }
    </style>
  </head>
  <body>
    <script>
      const RING = '<path d="M70.06 88.44 A38 38 0 1 1 88.44 70.06"/>';
      const RING_W = '<path d="M61.9 91.17 A38 38 0 1 1 91.17 61.9"/>';
      const V = {
        'A — wave tail': (s) =>
          RING +
          `<path class="acc" d="${s ? 'M18 0 H28 L38 -13 L52 13 L62 0 H70' : 'M20 0 H28 L36 -11 L48 11 L58 -8 L64 0 H70'}" transform="rotate(45 54 54) translate(54 54)" stroke-width="${s ? 9 : 7}"/>`,
        'B — plucked string': (s) =>
          RING +
          `<g class="acc" transform="rotate(45 54 54) translate(54 54)"><path d="M20 0 H68"/><path d="M28 0 C40 -9 56 -9 66 0 C56 9 40 9 28 0 Z" stroke-width="${s ? 5 : 3.5}" opacity="${s ? 1 : 0.85}"/></g>`,
        'C — string through the Q': (s) =>
          RING +
          '<path d="M73.8 73.8 L95.01 95.01"/>' +
          `<path class="acc" d="${s ? 'M-42 0 H-24 L-10 -13 L10 13 L24 0 H42' : 'M-42 0 H-26 L-18 -10 L-6 10 L6 -10 L18 10 L26 0 H42'}" transform="translate(54 54)" stroke-width="${s ? 9 : 7}"/>`,
      };
      function svg(name, size) {
        const small = size < 40;
        return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" stroke-width="${small ? 12 : 10}">${V[name](small)}</svg>`;
      }
      function sheet(theme) {
        let h = `<div class="sheet ${theme}"><h1>QaraamiGenAI mark — three variations (${theme})</h1><p>Sizes 96 / 48 / 26 (header) / 16, favicon tile, and the header lockup.</p><div class="row">`;
        for (const name of Object.keys(V)) {
          h += `<div class="card"><h2>${name}</h2><div class="sizes">${svg(name, 96)}${svg(name, 48)}${svg(name, 26)}${svg(name, 16)}<span class="fav" style="color:#EDE9DC">${svg(name, 24)}</span></div>`;
          h += `<div class="lockup">${svg(name, 26)}<span>Qaraami<b>GenAI</b></span></div></div>`;
        }
        return h + '</div></div>';
      }
      document.write(sheet('dark') + sheet('light'));
    </script>
  </body>
</html>
