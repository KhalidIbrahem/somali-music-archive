# CI — runs on every PR and on pushes to main/master (ARCHITECTURE.md §13 CI/CD).
# Gates: format (Prettier) → type check → unit/integration tests → build → security
# audit for the JS/TS workspaces, plus a fast Python job for the AI service's pure
# tests. Turborepo caches task output so unchanged workspaces are skipped.
#
# The API test step includes the db-backed integration suites (P5-03):
# mongodb-memory-server + embedded-postgres run real databases in-process on the
# runner — no service containers needed. The mongod binary download is cached.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: JS/TS workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before the format check, which is red on master for unrelated JSON
      # under runs/ and data/: this gate must run on every push.
      - name: Public audio rights (no research-only model output ships)
        run: node apps/web/scripts/check-public-audio-rights.mjs

      - name: Cache MongoDB test binaries
        # mongodb-memory-server downloads mongod (~100MB) on first run; cache it
        # so the integration suites don't re-download every CI run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Security audit (production deps, high severity)
        run: npm run audit:prod
        # Advisory, not a hard gate — a new transitive advisory should surface in
        # the run without blocking every unrelated PR. Reviewed, not ignored.
        continue-on-error: true

  python:
    name: AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test tooling
        # What the test suite imports, and no more: CPU-only torch, no model
        # weights (tests that need weights skip themselves). transformers and
        # peft pinned to the research env (MusicgenConfig.from_sub_models_config
        # is gone in later transformers). Clean 3.11 env, 2026-09-30: 739 passed, 1 skipped.
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-asyncio ruff numpy scipy fastapi httpx python-multipart pydantic-settings \
            soundfile music21 pyloudnorm pretty_midi safetensors transformers==4.57.6 peft==0.20.0 \
            internetarchive demucs torchcrepe yt-dlp

      - name: Lint (Ruff)
        run: ruff check .

      - name: Unit tests (pure — scale mapping, transcription pipeline)
        run: pytest -q
