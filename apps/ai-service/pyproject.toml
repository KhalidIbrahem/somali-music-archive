[project]
name = "somali-music-ai-service"
version = "0.1.0"
description = "AI/ML service for the Somali Music AI Preservation Platform: Whisper transcription, CREPE pitch extraction + Somali scale mapping, MERT embeddings."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Make the flat module layout (main.py, services/, routers/) importable from tests.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: no formatter runs on this package, and the research scripts carry long
# caption strings and table rows; wrapping them by hand is not worth a red CI.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `File()` / `Query()` / `Depends()` defaults are the framework idiom, not a bug.
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends", "fastapi.Header", "fastapi.Form", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells deliberately re-import their dependencies so each pipeline step
# is independently runnable after a Colab disconnect (the resumability design).
# F811 would "fix" that by deleting the re-imports and breaking cell isolation.
"notebooks/*.ipynb" = ["F811"]
# Batch entry points must bootstrap sys.path (so `python scripts/x.py` works
# from anywhere) before importing the service packages; imports therefore
# cannot sit at the very top. Same for tests gated on pytest.importorskip.
"scripts/*.py" = ["E402", "E702", "E741", "E731", "B905", "B007", "SIM115", "SIM105"]
"evaluation/*.py" = ["E402"]
"tests/test_classifiers.py" = ["E402"]
# Research batch scripts and their tests (2026-08/09): dense one-liners, `l` for a
# line, zip() without strict, open() without a context manager. Style only; every
# F (pyflakes) rule still applies to them.
"tests/*.py" = ["E702", "E741", "B905", "B007", "SIM115"]

[tool.mypy]
python_version = "3.11"
strict = true
# The heavy ML libs ship without type stubs; don't fail typecheck on their absence.
ignore_missing_imports = true
